<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Sign in · Mimex</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: "IBM Plex Mono", "Iosevka", "Cascadia Mono", monospace;
        background: #e9e9e9;
        color: #111;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
          max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        background: #e9e9e9;
      }

      main {
        width: min(24rem, 100%);
        border: 1px solid #cfcfcf;
        background: #f6f6f6;
        padding: 1rem;
      }

      h1 {
        margin: 0;
        letter-spacing: 0.1em;
        font-size: 1.1rem;
      }

      p {
        margin: 0.4rem 0 1rem;
        color: #575757;
        font-size: 0.85rem;
      }

      form,
      label {
        display: grid;
        gap: 0.5rem;
      }

      form {
        gap: 0.85rem;
      }

      label {
        gap: 0.25rem;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      input,
      button {
        width: 100%;
        min-height: 2.75rem;
        border: 1px solid #d6d6d6;
        border-radius: 0;
        font: inherit;
        font-size: 16px;
      }

      input {
        padding: 0.55rem;
        background: #fff;
        color: #111;
      }

      button {
        background: #e2e2e2;
        color: #111;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.65;
      }

      #message {
        min-height: 1.2rem;
        margin: 0;
        color: #4a1717;
      }

      @media (prefers-color-scheme: dark) {
        :root,
        body {
          background: #151515;
          color: #e8e8e8;
        }

        main {
          border-color: #4f4f4f;
          background: #1d1d1d;
        }

        p {
          color: #a9a9a9;
        }

        input {
          border-color: #3b3b3b;
          background: #131313;
          color: #e8e8e8;
        }

        button {
          border-color: #4f4f4f;
          background: #272727;
          color: #e8e8e8;
        }

        #message {
          color: #ffb4b4;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MIMEX</h1>
      <p>Sign in to this device.</p>
      <form id="loginForm">
        <label>
          Username
          <input id="username" name="username" value="mimex" autocomplete="username" required />
        </label>
        <label>
          Password
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        </label>
        <button id="submitBtn" type="submit">sign in</button>
        <p id="message" role="alert" aria-live="polite"></p>
      </form>
    </main>
    <script>
      const form = document.querySelector("#loginForm");
      const submitBtn = document.querySelector("#submitBtn");
      const message = document.querySelector("#message");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitBtn.disabled = true;
        message.textContent = "Signing in…";

        try {
          const username = document.querySelector("#username").value;
          const password = document.querySelector("#password").value;
          const response = await fetch("/auth/login", {
            method: "POST",
            cache: "no-store",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ username, password })
          });

          if (response.status !== 204) {
            throw new Error("Incorrect username or password.");
          }

          window.location.replace("/");
        } catch (error) {
          message.textContent = error instanceof Error ? error.message : "Sign-in failed.";
          document.querySelector("#password").select();
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
